model_list:
  # ─── Claude models — SAP AI Core naming (anthropic--claude-<version>-<tier>) ─
  # Real GitHub Copilot Claude backends (require VPN). Claude Code's own
  # claude-* ids fall through to the anthropic/* wildcard below.
  # Opus tier
  - model_name: anthropic--claude-4.8-opus
    litellm_params:
      model: github_copilot/claude-opus-4.8
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  - model_name: anthropic--claude-4.8-opus-fast
    litellm_params:
      model: github_copilot/claude-opus-4.8-fast
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  - model_name: anthropic--claude-4.7-opus
    litellm_params:
      model: github_copilot/claude-opus-4.7
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  - model_name: anthropic--claude-4.5-opus
    litellm_params:
      model: github_copilot/claude-opus-4.5
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  - model_name: anthropic--claude-5-opus
    litellm_params:
      model: github_copilot/claude-opus-5
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  # Sonnet tier
  - model_name: anthropic--claude-4.5-sonnet
    litellm_params:
      model: github_copilot/claude-sonnet-4.5
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  - model_name: anthropic--claude-4.6-sonnet
    litellm_params:
      model: github_copilot/claude-sonnet-4.6
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  - model_name: anthropic--claude-5-sonnet
    litellm_params:
      model: github_copilot/claude-sonnet-5
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  # Haiku tier (faster/cheaper)
  - model_name: anthropic--claude-4.5-haiku
    litellm_params:
      model: github_copilot/claude-haiku-4.5
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  # Fable
  - model_name: anthropic--claude-5-fable
    litellm_params:
      model: github_copilot/claude-fable-5
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  # ─── OpenAI GPT-5.x ──────────────────────────────────────────────────────
  # gpt-5.5/5.4/5.4-mini/5.3-codex are Responses-API only on this Copilot seat.
  # model_info mode:responses makes litellm dispatch to /responses. Do NOT add
  # extra_headers — they collide with litellm's default copilot-integration-id
  # and cause a 400. (gpt-5.6-sol/luna/terra are not served here and were removed.)
  - model_name: gpt-5.5
    litellm_params:
      model: github_copilot/gpt-5.5
    model_info:
      mode: responses

  - model_name: gpt-5.4
    litellm_params:
      model: github_copilot/gpt-5.4
    model_info:
      mode: responses

  - model_name: gpt-5.4-mini
    litellm_params:
      model: github_copilot/gpt-5.4-mini
    model_info:
      mode: responses

  - model_name: gpt-5.3-codex
    litellm_params:
      model: github_copilot/gpt-5.3-codex
    model_info:
      mode: responses

  # gpt-5-mini works via both chat/completions and responses (chat is fine)
  - model_name: gpt-5-mini
    litellm_params:
      model: github_copilot/gpt-5-mini
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  # ─── Google Gemini ──────────────────────────────────────────────────────
  - model_name: gemini-3.6-flash
    litellm_params:
      model: github_copilot/gemini-3.6-flash
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  - model_name: gemini-3.5-flash
    litellm_params:
      model: github_copilot/gemini-3.5-flash
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  - model_name: gemini-3.1-pro-preview
    litellm_params:
      model: github_copilot/gemini-3.1-pro-preview
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  - model_name: gemini-3-flash-preview
    litellm_params:
      model: github_copilot/gemini-3-flash-preview
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  - model_name: gemini-2.5-pro
    litellm_params:
      model: github_copilot/gemini-2.5-pro
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  # ─── Other ──────────────────────────────────────────────────────────────
  - model_name: grok-4.5
    litellm_params:
      model: github_copilot/grok-4.5
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  - model_name: kimi-k2.7-code
    litellm_params:
      model: github_copilot/kimi-k2.7-code
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  # ─── Legacy OpenAI names (mapped to current backends) ───────────────────
  - model_name: gpt-4
    litellm_params:
      model: github_copilot/gpt-5.5
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  - model_name: gpt-4o
    litellm_params:
      model: github_copilot/gpt-5.5
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  - model_name: gpt-4-turbo
    litellm_params:
      model: github_copilot/gpt-5.5
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  # ─── Fallback wildcard patterns ─────────────────────────────────────────
  - model_name: anthropic/*
    litellm_params:
      model: github_copilot/claude-sonnet-4.5
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  - model_name: openai/*
    litellm_params:
      model: github_copilot/gpt-5.5
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

# General settings
general_settings:
  master_key: your-anthropic-api-key-here

# Optional: Enable logging for debugging
litellm_settings:
  drop_params: True
  set_verbose: False
