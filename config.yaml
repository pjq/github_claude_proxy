model_list:
  # ─── Claude-named entries ───────────────────────────────────────────────
  # GitHub Copilot no longer exposes any claude-* backend models, so these
  # Claude aliases (used by Claude Code) map to the strongest current backend.
  - model_name: claude-sonnet-4.5
    litellm_params:
      model: github_copilot/gpt-5.6-sol
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

  - model_name: anthropic--claude-4.5-sonnet
    litellm_params:
      model: github_copilot/gpt-5.6-sol
      extra_headers:
        editor-version: "vscode/1.85.1"
        Copilot-Integration-Id: "vscode-chat"

